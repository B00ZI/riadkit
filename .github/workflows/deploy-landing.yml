name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["landingpage/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site (exclude build tooling)
        run: |
          mkdir -p _site
          cp -r landingpage/. _site/
          rm -rf _site/node_modules _site/package.json _site/package-lock.json _site/tailwind.config.js _site/src

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
